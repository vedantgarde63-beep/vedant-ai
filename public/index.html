<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <title>Vedant AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0f;
      color: white;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      border-bottom: 1px solid #24242c;
      background: #101015;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .logo span {
      opacity: .55;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px 18px 130px;
    }

    .welcome {
      min-height: 55vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .welcome h1 {
      font-size: clamp(38px, 8vw, 64px);
      margin: 0 0 12px;
      background: linear-gradient(90deg, #ffffff, #9c9ca8);
      -webkit-background-clip: text;
      color: transparent;
    }

    .welcome p {
      color: #9b9ba6;
      font-size: 17px;
      margin: 0;
    }

    .message {
      display: flex;
      gap: 12px;
      margin: 18px 0;
      line-height: 1.6;
    }

    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #24242d;
      font-size: 14px;
      font-weight: bold;
    }

    .user .avatar {
      background: #ffffff;
      color: #111;
    }

    .content {
      max-width: 760px;
      white-space: pre-wrap;
      word-break: break-word;
      padding-top: 5px;
    }

    .user .content {
      color: #f5f5f7;
    }

    .assistant .content {
      color: #d8d8df;
    }

    .typing {
      opacity: .65;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      background: linear-gradient(transparent, #0b0b0f 25%);
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px;
      border: 1px solid #30303a;
      border-radius: 18px;
      background: #15151b;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 16px;
      line-height: 1.5;
      max-height: 160px;
      padding: 9px;
      font-family: inherit;
    }

    textarea::placeholder {
      color: #777783;
    }

    #send {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 13px;
      background: white;
      color: #111;
      font-size: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    #send:hover {
      opacity: .85;
    }

    #send:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .notice {
      text-align: center;
      color: #666672;
      font-size: 11px;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 15px;
      }

      #chat {
        padding-left: 12px;
        padding-right: 12px;
      }

      .message {
        gap: 8px;
      }

      .avatar {
        width: 30px;
        height: 30px;
        min-width: 30px;
        font-size: 12px;
      }

      .input-area {
        padding: 10px;
      }

      .input-box {
        border-radius: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Vedant <span>AI</span></div>
  </header>

  <main>
    <div id="chat">

      <div class="welcome" id="welcome">
        <h1>Vedant AI</h1>
        <p>Ask me anything.</p>
      </div>

    </div>
  </main>

  <div class="input-area">
    <div class="input-box">

      <textarea
        id="message"
        rows="1"
        placeholder="Message Vedant AI..."
        autocomplete="off"
      ></textarea>

      <button id="send" title="Send">↑</button>

    </div>

    <div class="notice">
      Vedant AI can make mistakes. Check important information.
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const textarea = document.getElementById("message");
    const sendButton = document.getElementById("send");

    let messages = [];
    let busy = false;

    function addMessage(role, text) {
      if (welcome) {
        welcome.remove();
      }

      const wrapper = document.createElement("div");
      wrapper.className = "message " + role;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "Y" : "V";

      const content = document.createElement("div");
      content.className = "content";
      content.textContent = text;

      wrapper.appendChild(avatar);
      wrapper.appendChild(content);

      chat.appendChild(wrapper);
      chat.scrollTop = chat.scrollHeight;

      return content;
    }

    function setBusy(value) {
      busy = value;
      sendButton.disabled = value;
      textarea.disabled = value;
    }

    async function sendMessage() {
      const text = textarea.value.trim();

      if (!text || busy) {
        return;
      }

      textarea.value = "";
      textarea.style.height = "auto";

      messages.push({
        role: "user",
        content: text
      });

      addMessage("user", text);

      setBusy(true);

      const thinking = addMessage("assistant", "Thinking...");
      thinking.classList.add("typing");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: messages
          })
        });

        const data = await response.json();

        thinking.classList.remove("typing");

        if (!response.ok) {
          throw new Error(data.error || "Request failed.");
        }

        const reply = data.reply || "I couldn't generate a response.";

        thinking.textContent = reply;

        messages.push({
          role: "assistant",
          content: reply
        });

      } catch (error) {
        thinking.classList.remove("typing");
        thinking.textContent =
          "Sorry, Vedant AI couldn't answer right now.";
        console.error(error);
      }

      setBusy(false);
      textarea.focus();
    }

    sendButton.addEventListener("click", sendMessage);

    textarea.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    textarea.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height =
        Math.min(this.scrollHeight, 160) + "px";
    });

    textarea.focus();
  </script>

</body>
</html>
